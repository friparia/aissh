name: Build Desktop

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  desktop:
    name: Desktop ${{ matrix.goos }} / ${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
            cgo: '1'
          - runner: macos-15
            goos: darwin
            goarch: arm64
            cgo: '1'
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            cgo: '1'
            desktop_tags: webkit2_41
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            cgo: '1'
            desktop_tags: webkit2_41
          - runner: windows-2025
            goos: windows
            goarch: amd64
            cgo: '0'
          - runner: windows-11-arm
            goos: windows
            goarch: arm64
            cgo: '0'
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: ${{ matrix.cgo }}
      AISSH_DESKTOP_TAGS: ${{ matrix.desktop_tags || '' }}
      MACOSX_DEPLOYMENT_TARGET: '13.0'

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set build version
        shell: bash
        run: echo "VERSION=$(git describe --tags --always)" >> "$GITHUB_ENV"

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build macOS or Linux desktop
        if: runner.os != 'Windows'
        run: sh scripts/build-desktop.sh

      - name: Build Windows desktop
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-desktop.ps1

      - name: Test conversation AI selection in desktop UI
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/aissh-ui-test" --no-audit --no-fund playwright@1.56.1
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/aissh-ui-test/node_modules/playwright/index.mjs" \
            CHROME_PATH=/usr/bin/google-chrome AI_SELECTION_ONLY=1 node scripts/test-desktop-ui.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/aissh-ui-test/node_modules/playwright/index.mjs" \
            CHROME_PATH=/usr/bin/google-chrome MODELS_ONLY=1 node scripts/test-desktop-ui.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/aissh-ui-test/node_modules/playwright/index.mjs" \
            CHROME_PATH=/usr/bin/google-chrome TAKEOVER_ONLY=1 node scripts/test-desktop-ui.mjs

      - name: Verify macOS 13 compatibility metadata
        if: runner.os == 'macOS'
        run: python3 scripts/check-macos-bundle.py "dist/desktop/WRD AI SSH.app" "$GOARCH" "$MACOSX_DEPLOYMENT_TARGET"

      - name: Package macOS or Linux desktop
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist/desktop-packages
          base="aissh-desktop_${VERSION}_${GOOS}_${GOARCH}"
          if [[ "$GOOS" == darwin ]]; then
            ditto -c -k --sequesterRsrc --keepParent \
              "dist/desktop/WRD AI SSH.app" "dist/desktop-packages/${base}.zip"
          else
            tar -C dist/desktop -czf "dist/desktop-packages/${base}.tar.gz" aissh-desktop aissh
          fi
          cd dist/desktop-packages
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${base}".* > SHA256SUMS
          else
            shasum -a 256 "${base}".* > SHA256SUMS
          fi

      - name: Package Windows desktop
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/desktop-packages | Out-Null
          $name = "aissh-desktop_$($env:VERSION)_$($env:GOOS)_$($env:GOARCH).zip"
          $archive = Join-Path dist/desktop-packages $name
          Compress-Archive -Path dist/desktop/aissh-desktop.exe,dist/desktop/aissh.exe -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content -Encoding ascii dist/desktop-packages/SHA256SUMS

      - name: Upload desktop archive and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aissh-desktop-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/desktop-packages/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
